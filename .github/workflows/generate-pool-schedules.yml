
name: Generate Rutgers Pool Schedules

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday of the schedule week (YYYY-MM-DD)"
        required: true
        type: string
      olympic_pool:
        description: "Generate Olympic Pool PDF"
        required: true
        type: boolean
        default: true
      patio_pool:
        description: "Generate Patio Pool PDF"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schedule tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright reportlab requests beautifulsoup4 python-pptx
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Generate selected schedules
        run: |
          python generate_pool_schedules.py \
            --week-start "${{ inputs.week_start }}" \
            --olympic "${{ inputs.olympic_pool }}" \
            --patio "${{ inputs.patio_pool }}"

      - name: Save generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Rutgers-Pool-Schedules
          path: output/*.pdf
          if-no-files-found: error
          retention-days: 14
